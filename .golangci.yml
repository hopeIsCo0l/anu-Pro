linters:
  enable:
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - govet
    - gofmt
    - misspell
    - unconvert
    - unparam

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  exclude-rules:
    # Test files can use _ for error returns
    - path: "_test\\.go"
      linters:
        - errcheck
