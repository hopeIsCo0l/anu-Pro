services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anu
      POSTGRES_PASSWORD: anu
      POSTGRES_DB: anu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anu"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/anu-dev &&
        echo 'MinIO bucket ready'
      "

  migrate:
    build: .
    entrypoint: ["/app/migrate", "up", "public"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    entrypoint: ["/app/api"]
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    entrypoint: ["/app/worker"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
